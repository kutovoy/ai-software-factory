agentDefaults:
  harness:
    model: openai/gpt-5
    type: opencode
  runner: local-docker
alias: Example
description: "Reference factory exercising every resource type: a foreman routes work items through triage, spec, implement, review and verify agents."
gates:
  deploy: agent
  implement: agent
  plan: agent
  pr_review: agent
  review: agent
  spec: agent
integrations:
  - github
mcpServers:
  github:
    command: github-mcp
mergePolicy: auto_on_green
name: example
repositories:
  - name: api-service
    owner: acme
schemaVersion: v1alpha1
secrets:
  - OPENCODE_API_KEY
selfImprovement:
  enabled: true
  failedRunThreshold: 3
  requireBenchmarkWin: true
  reviewerType: humans
