agentDefaults:
  harness:
    model: env:FACTORY_MODEL
    type: opencode
  runner: local-docker
alias: Example — lights off
description: "Reference factory exercising every resource type: a foreman routes work items through triage, spec, implement, review and verify agents."
gates:
  deploy: agent
  implement: agent
  plan: agent
  pr_review: agent
  review: agent
  spec: agent
improvement:
  authority: canary
  canaryPercent: 10
  maxProbes: 3
  observationWindowHours: 24
  rollbackThreshold: 0.1
integrations:
  - github
mcpServers:
  github:
    command: github-mcp
mergePolicy: auto_on_green
name: example-lights-off
repositories:
  - name: api-service
    owner: acme
schemaVersion: v1alpha1
secrets:
  - OPENCODE_API_KEY
selfImprovement:
  enabled: true
  failedRunThreshold: 3
  requireBenchmarkWin: true
  reviewerType: humans
