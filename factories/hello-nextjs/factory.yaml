agentDefaults:
  harness:
    model: env:FACTORY_MODEL
    type: opencode
  runner: local-docker
agentVerdict: required
alias: Hello Next.js
budget:
  maxCostUsdPerFactory: 100
  maxCostUsdPerRun: 5
description: "Builds a minimal hello-world Next.js site in a repository: package.json, App Router layout and page, and a short README."
gates:
  deploy: agent
  implement: agent
  plan: agent
  pr_review: agent
  review: agent
  spec: agent
governance:
  audit:
    export: jsonl
  autonomyLevel: full
  requireHumanActions:
    - git.push
id: fac_01M6ND4JXHE8DXSQVEFNJWNST9
mcp:
  discovery:
    enabled: true
    maxServers: 3
mergePolicy: auto_on_green
name: hello-nextjs
repositories:
  - name: hello-nextjs
    owner: acme
schemaVersion: v1alpha1
secrets: []
