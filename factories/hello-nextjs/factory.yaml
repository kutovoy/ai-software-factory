agentDefaults:
  harness:
    model: env:FACTORY_MODEL
    type: opencode
  runner: local-docker
agentVerdict: required
alias: Hello Next.js
budget:
  maxCostUsdPerFactory: 100
  maxCostUsdPerRun: 5
description: "Builds a minimal hello-world Next.js site in a repository: package.json, App Router layout and page, and a short README."
gates:
  deploy: agent
  implement: agent
  plan: agent
  pr_review: agent
  review: agent
  spec: agent
governance:
  audit:
    export: jsonl
  autonomyLevel: full
  requireHumanActions:
    - git.push
  risk:
    defaultTier: low
    highRiskPaths:
      - "auth/**"
      - "billing/**"
      - "migrations/**"
      - "public-api/**"
      - "security/**"
    tiers:
      low:
        planApproval: auto
        review: agent
        merge: auto_on_green
      medium:
        planApproval: human
        review: agent
        merge: auto_on_green
      high:
        planApproval: human
        review: human
        merge: human
id: fac_01M890NWYEE50996AGBV307XEY
mcp:
  discovery:
    enabled: true
    maxServers: 3
mergePolicy: auto_on_green
quality:
  proof:
    kinds:
      - screenshot
      - video
      - html
      - curl
      - report
    requireForUi: true
  slopBudget:
    high:
      maxChangedFiles: 20
      maxComplexityDelta: 20
      maxDiffLines: 800
      maxDuplicationDeltaPercent: 2
      maxNewDependencies: 2
    low:
      maxChangedFiles: 10
      maxComplexityDelta: 5
      maxDiffLines: 250
      maxDuplicationDeltaPercent: 0.5
      maxNewDependencies: 8
    medium:
      maxChangedFiles: 15
      maxComplexityDelta: 10
      maxDiffLines: 500
      maxDuplicationDeltaPercent: 1
      maxNewDependencies: 10
name: hello-nextjs
repositories:
  - name: hello-nextjs
    owner: acme
schemaVersion: v1alpha1
secrets: []
