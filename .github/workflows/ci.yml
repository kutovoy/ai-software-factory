name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, Docker-free gate: typecheck, unit/integration tests, definition validation and
  # canonical-export round-trip (`bun run ci` → scripts/ci.sh).
  unit:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck, tests, definition checks
        run: bun run ci

  # Docker-backed gate: the full compose stack, the smoke test (health, migrations, a
  # fake-harness run, SSE, permission approval, inference proxy, replay) and Playwright.
  e2e:
    name: compose smoke + playwright
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Bring up the stack
        run: docker compose up -d --build
      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: Install Playwright chromium
        run: cd apps/web && bunx playwright install --with-deps chromium
      - name: Playwright
        env:
          CI: '1'
        run: cd apps/web && bunx playwright test
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
