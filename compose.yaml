# Full stack for Phase 2b: postgres (read model) + Temporal dev server + forgejo (local forge)
# + api + worker + web.
#
#   docker compose up -d
#   bash scripts/forgejo-bootstrap.sh     # seeds the admin, token, org and repo
#   bash scripts/smoke.sh
#
# Inference credentials live only in the api/worker containers; the runner sandbox sees
# just OPENAI_BASE_URL=<proxy>/v1 and OPENAI_API_KEY=<per-run token> (ADR-011).
#
# The local forge is enabled by default (spec `forge`). To opt out:
#   FORGEJO_ENABLED=0 docker compose -f compose.yaml -f compose.no-forgejo.yaml up -d

name: factory

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates `factory_test` on first init so integration suites never mix demo rows.
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/10-factory-test.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U factory -d factory']
      interval: 3s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0 --ui-port 8233
    ports:
      - '7233:7233'
      - '8233:8233'
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  # Local forge (spec `forge`). HTTP is served at the console origin under /extras/forgejo by
  # the web app's same-origin proxy (apps/web/src/app/extras/forgejo/[[...path]]/route.ts),
  # which injects the trusted `X-WebAuth-User` header (single-user mode, ADR-032).
  # The HTTP port stays unpublished: the forge is reachable only from the compose network, so
  # the identity header cannot be spoofed from the browser. SSH *is* published (2222) because
  # git-over-SSH needs a host port; it authenticates with keys, not that header.
  # Enabled by default; to opt out run
  #   FORGEJO_ENABLED=0 docker compose -f compose.yaml -f compose.no-forgejo.yaml up -d
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1
    environment:
      # Subpath hosting: ROOT_URL carries /extras/forgejo/, STATIC_URL_PREFIX strips it for
      # assets (<https://forgejo.org/docs/v17.0/admin/setup/reverse-proxy/>).
      FORGEJO__server__ROOT_URL: http://localhost:3000/extras/forgejo/
      FORGEJO__server__STATIC_URL_PREFIX: /extras/forgejo
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__server__HTTP_PORT: '3000'
      # Built-in SSH server (spec `forge-transport` › SSH access). SSH_LISTEN_PORT is the
      # port inside the container; SSH_PORT is what clone URLs advertise (the published
      # host port). Host keys persist in the `forgejo-data` volume, so the host fingerprint
      # survives restarts. Clone: ssh://git@localhost:2222/<org>/<repo>.git
      FORGEJO__server__DISABLE_SSH: 'false'
      FORGEJO__server__START_SSH_SERVER: 'true'
      FORGEJO__server__SSH_PORT: '2222'
      FORGEJO__server__SSH_LISTEN_PORT: '22'
      FORGEJO__server__SSH_DOMAIN: localhost
      FORGEJO__server__OFFLINE_MODE: 'true'
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: factory
      FORGEJO__database__PASSWD: factory
      FORGEJO__database__SSL_MODE: disable
      # Skip the install wizard; the bootstrap script seeds the admin instead.
      FORGEJO__security__INSTALL_LOCK: 'true'
      # Auto-login (single-user v1): trust the header from the proxy only. The forge is not
      # published on the host, so every request arrives through the console proxy.
      FORGEJO__service__ENABLE_REVERSE_PROXY_AUTHENTICATION: 'true'
      FORGEJO__security__REVERSE_PROXY_AUTHENTICATION_USER: X-WebAuth-User
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: '*'
      FORGEJO__service__DISABLE_REGISTRATION: 'true'
      FORGEJO__actions__ENABLED: 'false'
    ports:
      # git-over-SSH only. HTTP stays on the compose network and is proxied by the console.
      - '2222:22'
    # The Forgejo image ships an OpenSSH daemon as an s6 service bound to :22. The built-in
    # SSH server (START_SSH_SERVER=true) listens on the same port, so the two would fight and
    # the container would exit with "bind: address already in use". Masking that service
    # directory leaves s6 running the forge alone and lets the built-in server own :22;
    # host keys live under APP_DATA_PATH (/data/gitea/ssh) inside `forgejo-data`.
    tmpfs:
      - /etc/s6/openssh
    volumes:
      - forgejo-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/api/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # S3-compatible artifact store (ADR-047). LOCAL DEVELOPMENT ONLY: the published S3 and
  # console ports are for inspecting objects from the host; production deployments must put
  # RustFS behind TLS and set S3_ENDPOINT to an endpoint runner hosts can reach.
  rustfs:
    image: rustfs/rustfs:latest
    command: ['/data']
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-factory-rustfs}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-factory-rustfs-secret}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_OBS_LOGGER_LEVEL: 'error'
      RUSTFS_OBS_LOG_DIRECTORY: '/logs'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Creates the artifact bucket once. `restart: no` keeps it a one-shot init job; the API and
  # agent upload path tolerate a missing bucket by returning upload errors instead of losing
  # the run's metadata (spec `artifact-store` › Upload).
  rustfs-init:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-factory-rustfs}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-factory-rustfs-secret}
      S3_BUCKET: ${S3_BUCKET:-factory-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
    entrypoint:
      - /bin/sh
      - -c
      - >
        status=$(curl -sS -o /dev/null -w '%{http_code}' --aws-sigv4 "aws:amz:$$S3_REGION:s3" --user "$$RUSTFS_ACCESS_KEY:$$RUSTFS_SECRET_KEY" -X PUT "http://rustfs:9000/$$S3_BUCKET");
        case "$$status" in 200|409) echo "bucket ready ($$status)"; exit 0;; *) echo "bucket init failed ($$status)"; exit 1;; esac
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://factory:factory@postgres:5432/factory
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-factory-runs}
      FACTORY_ROOT: /repo/factories
      REPO_ROOT: /repo
      RUNS_DIR: /app/runs
      DEFAULT_FACTORY: ${DEFAULT_FACTORY:-example}
      # Model references (ADR-028): definitions declare env:FACTORY_* and these values
      # decide which model the operator's provider serves. Never hardcoded in git.
      FACTORY_MODEL: ${FACTORY_MODEL:-best_llm}
      FACTORY_SMALL_MODEL: ${FACTORY_SMALL_MODEL:-best_llm}
      FACTORY_REVIEW_MODEL: ${FACTORY_REVIEW_MODEL:-best_llm}
      API_PORT: '8080'
      FACTORY_VERSION: ${FACTORY_VERSION:-0.0.0-dev}
      # Sandbox-facing URL of this API's proxy (Docker Desktop resolves this to the host).
      PROXY_PUBLIC_URL: ${PROXY_PUBLIC_URL:-http://host.docker.internal:8080/v1}
      # Upstream model endpoint. Defaults to the built-in stub so CI needs no credentials.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://127.0.0.1:8080/internal/stub-model/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-provider-secret}
      PROXY_STUB_UPSTREAM: ${PROXY_STUB_UPSTREAM:-1}
      EXPOSE_RUN_TOKEN: ${EXPOSE_RUN_TOKEN:-1}
      # Remote runner control plane (Linux MVP). Disabled by default; enable after a host
      # agent is enrolled. The agent never receives Temporal/Postgres credentials.
      REMOTE_RUNNER: ${REMOTE_RUNNER:-0}
      REMOTE_RUNNER_PLATFORM: ${REMOTE_RUNNER_PLATFORM:-linux}
      REMOTE_RUNNER_POOL: ${REMOTE_RUNNER_POOL:-default}
      RUNNER_REPO_URL: ${RUNNER_REPO_URL:-}
      REMOTE_COMMAND_TIMEOUT_MS: ${REMOTE_COMMAND_TIMEOUT_MS:-120000}
      REMOTE_LEASE_TTL_MS: ${REMOTE_LEASE_TTL_MS:-900000}
      REMOTE_ALERT_INTERVAL_MS: ${REMOTE_ALERT_INTERVAL_MS:-30000}
      # Artifact store (ADR-047). Compose enables RustFS; agents receive only short-lived
      # presigned URLs. S3_ENDPOINT is the URL a runner host can reach (localhost works for
      # a host-local agent; override for a remote host). S3_INTERNAL_ENDPOINT is server-side.
      ARTIFACT_STORE: ${ARTIFACT_STORE:-s3}
      # The generated Linux agent container reaches RustFS through the host gateway; macOS
      # native agents should set S3_ENDPOINT=http://localhost:9000 (or a public TLS URL).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://host.docker.internal:9000}
      # Browser-facing download endpoint; defaults to S3_ENDPOINT. Set this to
      # http://localhost:9000 when agents upload via host.docker.internal.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://rustfs:9000}
      S3_BUCKET: ${S3_BUCKET:-factory-artifacts}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-factory-rustfs}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-factory-rustfs-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-1}
      S3_PRESIGN_EXPIRY_SECONDS: ${S3_PRESIGN_EXPIRY_SECONDS:-900}
      S3_MAX_ARTIFACT_BYTES: ${S3_MAX_ARTIFACT_BYTES:-52428800}
      # SLA for a human permission wait before it is auto-denied (ADR-013).
      PERMISSION_TIMEOUT_MS: ${PERMISSION_TIMEOUT_MS:-1800000}
      # Scoring: stub judge in compose (no credentials); daily cap bounds judge spend.
      SCORING_JUDGE_MODE: ${SCORING_JUDGE_MODE:-stub}
      SCORING_MAX_SCORES_PER_DAY: ${SCORING_MAX_SCORES_PER_DAY:-200}
      SCORING_CADENCE_MS: ${SCORING_CADENCE_MS:-0}
      SCORING_CRON: ${SCORING_CRON:-0 3 * * *}
      SCORING_WINDOW_DAYS: ${SCORING_WINDOW_DAYS:-1}
      # Benchmarks (Phase 4b): compose runs hermetic trials on the fake harness + fake forge.
      BENCHMARK_HARNESS: ${BENCHMARK_HARNESS:-fake}
      BENCHMARK_RUNNER: ${BENCHMARK_RUNNER:-fake}
      BENCHMARK_CONCURRENCY: ${BENCHMARK_CONCURRENCY:-2}
      BENCHMARK_DEFAULT_RUN_COST_USD: ${BENCHMARK_DEFAULT_RUN_COST_USD:-0.5}
      BENCHMARK_CONFIRM_THRESHOLD_USD: ${BENCHMARK_CONFIRM_THRESHOLD_USD:-5}
      BENCHMARK_MAX_COST_USD: ${BENCHMARK_MAX_COST_USD:-25}
      BENCHMARK_PASS_THRESHOLD: ${BENCHMARK_PASS_THRESHOLD:-0.8}
      # Self-improvement (Phase 5): compose lowers the eligibility floor so the smoke corpus
      # (one scored run + benchmark trials) can produce a proposal deterministically.
      IMPROVEMENT_MIN_SCORED_RUNS: ${IMPROVEMENT_MIN_SCORED_RUNS:-1}
      IMPROVEMENT_WINDOW_DAYS: ${IMPROVEMENT_WINDOW_DAYS:-30}
      IMPROVEMENT_MAX_PROPOSALS: ${IMPROVEMENT_MAX_PROPOSALS:-5}
      DEFINITION_REPO_OWNER: ${DEFINITION_REPO_OWNER:-factory}
      # Canary follow-ups: keep the last N candidate trees; optional deploy hook timeout.
      CANARY_KEEP_TREES: ${CANARY_KEEP_TREES:-3}
      CANARY_DEPLOY_TIMEOUT_MS: ${CANARY_DEPLOY_TIMEOUT_MS:-60000}
      # Retention/GC: terminal runs older than RETENTION_DAYS, beyond the newest
      # RETENTION_KEEP_RUNS per factory, are removed by the worker sweep and the manual
      # runs/gc route. Set RETENTION_ENABLED=0 to disable; RETENTION_DRY_RUN=1 for a first pass.
      RETENTION_ENABLED: ${RETENTION_ENABLED:-1}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      RETENTION_KEEP_RUNS: ${RETENTION_KEEP_RUNS:-100}
      RETENTION_SWEEP_INTERVAL_MS: ${RETENTION_SWEEP_INTERVAL_MS:-21600000}
      RETENTION_DRY_RUN: ${RETENTION_DRY_RUN:-0}
      # Webhook HMAC (by secret reference), payload cap and the merge queue.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-smoke-webhook-secret}
      # Public base URL of the API; the console renders
      # ${WEBHOOK_PUBLIC_URL}/api/v1/webhooks/github as the delivery target.
      WEBHOOK_PUBLIC_URL: ${WEBHOOK_PUBLIC_URL:-http://localhost:8080}
      WEBHOOK_MAX_BYTES: ${WEBHOOK_MAX_BYTES:-1000000}
      MERGE_BATCH_SIZE: ${MERGE_BATCH_SIZE:-2}
      MERGE_CHECKS_TIMEOUT_MS: ${MERGE_CHECKS_TIMEOUT_MS:-600000}
      MERGE_CHECKS_POLL_MS: ${MERGE_CHECKS_POLL_MS:-2000}
      MERGE_MAX_BATCHES: ${MERGE_MAX_BATCHES:-25}
      MERGE_IDLE_INTERVAL_MS: ${MERGE_IDLE_INTERVAL_MS:-30000}
      MERGE_IDLE_CYCLES: ${MERGE_IDLE_CYCLES:-2}
      GITHUB_DRY_RUN: ${GITHUB_DRY_RUN:-0}
      # Local forge backend (spec `code-forge` › Forgejo backend). The Gitea-compatible API
      # lives at /api/v1; the token is resolved by name at run time (ADR-026).
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-http://forgejo:3000/api/v1}
      # Secrets registry (ADR-026): a dummy execution secret so the smoke run resolves one
      # name and records usage. Never a real credential.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-smoke-github-token}
      # Console auth (change `add-console-auth`). LOCAL DEVELOPMENT ONLY: this bootstrap
      # admin and password are checked into git for the compose demo — never reuse them on
      # a reachable host (see SECURITY.md). Override every value from the environment.
      AUTH_REQUIRED: ${AUTH_REQUIRED:-1}
      FACTORY_ADMIN_EMAIL: ${FACTORY_ADMIN_EMAIL:-admin@factory.local}
      FACTORY_ADMIN_PASSWORD: ${FACTORY_ADMIN_PASSWORD:-factory-admin}
      # `AUTH_COOKIE_SECURE=1` when the console is served over HTTPS.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-0}
      # Personal forge org created on first login: `u-<username>`.
      FORGEJO_ORG_PREFIX: ${FORGEJO_ORG_PREFIX:-u-}
    ports:
      - '8080:8080'
    volumes:
      # Definitions are git-backed and promotion rewrites the local checkout when a canary
      # is promoted (ADR-049), so the API needs write access to `/repo`; run workspaces are
      # still isolated in the runner sandbox.
      - ./:/repo
      - ./runs:/app/runs
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      # /health stays unversioned on purpose: a probe must not follow a version bump.
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # The console reads the API server-side only (ADR-012). The public URL is kept for
      # parity/debugging; the browser talks to same-origin /api/* route handlers.
      API_BASE_URL: http://api:8080
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      # Same-origin proxy for the local forge (spec `forge`): the rewrite target and the
      # identity the proxy asserts. Both are server-side only.
      FORGEJO_URL: ${FORGEJO_URL:-http://forgejo:3000}
      FORGEJO_ADMIN_USER: ${FORGEJO_ADMIN_USER:-factory}
      FORGEJO_ENABLED: ${FORGEJO_ENABLED:-1}
      # Console auth (change `add-console-auth`): the console redirects unauthenticated
      # visitors to /login and forwards the `factory_session` cookie. LOCAL DEV ONLY —
      # the bootstrap credentials live in the api service above.
      AUTH_REQUIRED: ${AUTH_REQUIRED:-1}
      NODE_ENV: production
      PORT: '3000'
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: packages/orchestration/Dockerfile
    environment:
      DATABASE_URL: postgres://factory:factory@postgres:5432/factory
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-factory-runs}
      FACTORY_ROOT: /repo/factories
      REPO_ROOT: /repo
      RUNS_DIR: /app/runs
      PROXY_PUBLIC_URL: ${PROXY_PUBLIC_URL:-http://host.docker.internal:8080/v1}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://127.0.0.1:8080/internal/stub-model/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-provider-secret}
      RUNNER_BACKEND: ${RUNNER_BACKEND:-docker}
      # The worker runs in a container, so it cannot reach a port published on the host's
      # 127.0.0.1 and the daemon cannot see the worker's filesystem. Sandboxes therefore
      # join the dedicated `factory-runners` network (worker + sandboxes only, no Postgres
      # or Temporal) and the workspace is copied in/out with `docker cp`.
      RUNNER_NETWORK: ${RUNNER_NETWORK:-factory-runners}
      RUNNER_WORKSPACE_MODE: ${RUNNER_WORKSPACE_MODE:-copy}
      # Remote runner control plane (Linux MVP). The worker writes commands to Postgres and
      # waits for agent results; no Temporal/Postgres credentials go to the remote host.
      REMOTE_RUNNER: ${REMOTE_RUNNER:-0}
      REMOTE_RUNNER_PLATFORM: ${REMOTE_RUNNER_PLATFORM:-linux}
      REMOTE_RUNNER_POOL: ${REMOTE_RUNNER_POOL:-default}
      RUNNER_REPO_URL: ${RUNNER_REPO_URL:-}
      REMOTE_COMMAND_TIMEOUT_MS: ${REMOTE_COMMAND_TIMEOUT_MS:-120000}
      REMOTE_LEASE_TTL_MS: ${REMOTE_LEASE_TTL_MS:-900000}
      REMOTE_ALERT_INTERVAL_MS: ${REMOTE_ALERT_INTERVAL_MS:-30000}
      # Artifact store metadata (ADR-047): the agent uploads; the worker records keys and
      # upload errors. Same bucket/credentials as the API so a presigned key is interpretable.
      ARTIFACT_STORE: ${ARTIFACT_STORE:-s3}
      # The generated Linux agent container reaches RustFS through the host gateway; macOS
      # native agents should set S3_ENDPOINT=http://localhost:9000 (or a public TLS URL).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://host.docker.internal:9000}
      # Browser-facing download endpoint; defaults to S3_ENDPOINT. Set this to
      # http://localhost:9000 when agents upload via host.docker.internal.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://rustfs:9000}
      S3_BUCKET: ${S3_BUCKET:-factory-artifacts}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-factory-rustfs}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-factory-rustfs-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-1}
      S3_PRESIGN_EXPIRY_SECONDS: ${S3_PRESIGN_EXPIRY_SECONDS:-900}
      S3_MAX_ARTIFACT_BYTES: ${S3_MAX_ARTIFACT_BYTES:-52428800}
      # Model references (ADR-028): the worker resolves env:FACTORY_* at dispatch time.
      FACTORY_MODEL: ${FACTORY_MODEL:-best_llm}
      FACTORY_SMALL_MODEL: ${FACTORY_SMALL_MODEL:-best_llm}
      FACTORY_REVIEW_MODEL: ${FACTORY_REVIEW_MODEL:-best_llm}
      WORKER_HEARTBEAT_FILE: /app/runs/.worker-heartbeat
      PERMISSION_TIMEOUT_MS: ${PERMISSION_TIMEOUT_MS:-1800000}
      # Scoring (Phase 4a): deterministic checks are free; judges are sampled and capped.
      SCORING_JUDGE_MODE: ${SCORING_JUDGE_MODE:-stub}
      SCORING_MAX_SCORES_PER_DAY: ${SCORING_MAX_SCORES_PER_DAY:-200}
      SCORING_CADENCE_MS: ${SCORING_CADENCE_MS:-0}
      SCORING_CRON: ${SCORING_CRON:-0 3 * * *}
      SCORING_WINDOW_DAYS: ${SCORING_WINDOW_DAYS:-1}
      # Benchmarks (Phase 4b): hermetic trials on the fake harness + fake forge in compose.
      BENCHMARK_CONCURRENCY: ${BENCHMARK_CONCURRENCY:-2}
      BENCHMARK_DEFAULT_RUN_COST_USD: ${BENCHMARK_DEFAULT_RUN_COST_USD:-0.5}
      BENCHMARK_CONFIRM_THRESHOLD_USD: ${BENCHMARK_CONFIRM_THRESHOLD_USD:-5}
      BENCHMARK_MAX_COST_USD: ${BENCHMARK_MAX_COST_USD:-25}
      BENCHMARK_PASS_THRESHOLD: ${BENCHMARK_PASS_THRESHOLD:-0.8}
      # Self-improvement (Phase 5): eligibility floor + corpus window.
      IMPROVEMENT_MIN_SCORED_RUNS: ${IMPROVEMENT_MIN_SCORED_RUNS:-1}
      IMPROVEMENT_WINDOW_DAYS: ${IMPROVEMENT_WINDOW_DAYS:-30}
      IMPROVEMENT_MAX_PROPOSALS: ${IMPROVEMENT_MAX_PROPOSALS:-5}
      DEFINITION_REPO_OWNER: ${DEFINITION_REPO_OWNER:-factory}
      CANARY_KEEP_TREES: ${CANARY_KEEP_TREES:-3}
      CANARY_DEPLOY_TIMEOUT_MS: ${CANARY_DEPLOY_TIMEOUT_MS:-60000}
      # Retention/GC: terminal runs older than RETENTION_DAYS, beyond the newest
      # RETENTION_KEEP_RUNS per factory, are removed by the worker sweep and the manual
      # runs/gc route. Set RETENTION_ENABLED=0 to disable; RETENTION_DRY_RUN=1 for a first pass.
      RETENTION_ENABLED: ${RETENTION_ENABLED:-1}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      RETENTION_KEEP_RUNS: ${RETENTION_KEEP_RUNS:-100}
      RETENTION_SWEEP_INTERVAL_MS: ${RETENTION_SWEEP_INTERVAL_MS:-21600000}
      RETENTION_DRY_RUN: ${RETENTION_DRY_RUN:-0}
      # Local runner sandbox (ADR-025): `exec` = macOS sandbox-exec, `none` = unconfined.
      RUNNER_SANDBOX: ${RUNNER_SANDBOX:-none}
      # Phase 3b: merge queue (ADR-022). The queue workflow runs in this worker.
      MERGE_BATCH_SIZE: ${MERGE_BATCH_SIZE:-2}
      MERGE_CHECKS_TIMEOUT_MS: ${MERGE_CHECKS_TIMEOUT_MS:-600000}
      MERGE_CHECKS_POLL_MS: ${MERGE_CHECKS_POLL_MS:-2000}
      MERGE_MAX_BATCHES: ${MERGE_MAX_BATCHES:-25}
      MERGE_IDLE_INTERVAL_MS: ${MERGE_IDLE_INTERVAL_MS:-30000}
      MERGE_IDLE_CYCLES: ${MERGE_IDLE_CYCLES:-2}
      # Secrets registry (ADR-026): the worker resolves execution secrets by name; the
      # smoke uses a dummy value so usage can be audited without a real credential.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-smoke-github-token}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-http://forgejo:3000/api/v1}
      # ADR-013: permission waits hold no activity slot, so 8 slots (the old hardcoded
      # value that used to starve the queue) is enough for eight blocked runs plus new work.
      # Raise for more concurrent streaming runs; the code default is Temporal's 100.
      WORKER_MAX_CONCURRENT_ACTIVITY_TASKS: ${WORKER_MAX_CONCURRENT_ACTIVITY_TASKS:-8}
      WORKER_MAX_CONCURRENT_WORKFLOW_TASKS: ${WORKER_MAX_CONCURRENT_WORKFLOW_TASKS:-8}
      # Orphan runner reaper: reconciles label-managed sandboxes with runs + Temporal.
      RUNNER_REAPER: ${RUNNER_REAPER:-1}
      RUNNER_REAPER_INTERVAL_MS: ${RUNNER_REAPER_INTERVAL_MS:-300000}
      RUNNER_REAPER_DRY_RUN: ${RUNNER_REAPER_DRY_RUN:-0}
      RUNNER_REAPER_MAX_AGE_MS: ${RUNNER_REAPER_MAX_AGE_MS:-21600000}
      RUNNER_REAPER_GRACE_MS: ${RUNNER_REAPER_GRACE_MS:-300000}
    # Temporal worker grace is 90s and force-stop is 120s; give compose enough room to
    # deliver SIGTERM and let activities finish cleanup before SIGKILL.
    stop_grace_period: 150s
    volumes:
      # Definitions are git-backed and promotion rewrites the local checkout when a canary
      # is promoted (ADR-049), so the API needs write access to `/repo`; run workspaces are
      # still isolated in the runner sandbox.
      - ./:/repo
      - ./runs:/app/runs
      # Real (non-fake) runs lease sibling containers through the docker backend.
      - /var/run/docker.sock:/var/run/docker.sock
    # Sandboxes join `factory-runners` so the worker can reach the harness by container IP
    # without publishing a port on the host; the default network still carries Postgres,
    # Temporal and the API.
    networks:
      - default
      - runners
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const s = require('node:fs').statSync('/app/runs/.worker-heartbeat'); process.exit(Date.now() - s.mtimeMs > 60000 ? 1 : 0)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  forgejo-data:
  rustfs-data:
  rustfs-logs:

networks:
  # Sandboxes only. Kept off the default network so a run cannot reach Postgres, Temporal
  # or the API directly; the harness still reaches the inference proxy through
  # `host.docker.internal`.
  runners:
    name: factory-runners
