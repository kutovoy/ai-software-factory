# Full stack for Phase 2b: postgres (read model) + Temporal dev server + api + worker + web.
#
#   docker compose up -d
#   bash scripts/smoke.sh
#
# Inference credentials live only in the api/worker containers; the runner sandbox sees
# just OPENAI_BASE_URL=<proxy>/v1 and OPENAI_API_KEY=<per-run token> (ADR-011).

name: factory

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U factory -d factory']
      interval: 3s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0 --ui-port 8233
    ports:
      - '7233:7233'
      - '8233:8233'
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://factory:factory@postgres:5432/factory
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-factory-runs}
      FACTORY_ROOT: /repo/factories
      REPO_ROOT: /repo
      RUNS_DIR: /app/runs
      DEFAULT_FACTORY: ${DEFAULT_FACTORY:-example}
      API_PORT: '8080'
      FACTORY_VERSION: ${FACTORY_VERSION:-0.0.0-dev}
      # Sandbox-facing URL of this API's proxy (Docker Desktop resolves this to the host).
      PROXY_PUBLIC_URL: ${PROXY_PUBLIC_URL:-http://host.docker.internal:8080/v1}
      # Upstream model endpoint. Defaults to the built-in stub so CI needs no credentials.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://127.0.0.1:8080/internal/stub-model/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-provider-secret}
      PROXY_STUB_UPSTREAM: ${PROXY_STUB_UPSTREAM:-1}
      EXPOSE_RUN_TOKEN: ${EXPOSE_RUN_TOKEN:-1}
      # SLA for a human permission wait before it is auto-denied (ADR-013).
      PERMISSION_TIMEOUT_MS: ${PERMISSION_TIMEOUT_MS:-1800000}
      # Scoring: stub judge in compose (no credentials); daily cap bounds judge spend.
      SCORING_JUDGE_MODE: ${SCORING_JUDGE_MODE:-stub}
      SCORING_MAX_SCORES_PER_DAY: ${SCORING_MAX_SCORES_PER_DAY:-200}
      SCORING_CADENCE_MS: ${SCORING_CADENCE_MS:-0}
      SCORING_CRON: ${SCORING_CRON:-0 3 * * *}
      SCORING_WINDOW_DAYS: ${SCORING_WINDOW_DAYS:-1}
      # Benchmarks (Phase 4b): compose runs hermetic trials on the fake harness + fake forge.
      BENCHMARK_HARNESS: ${BENCHMARK_HARNESS:-fake}
      BENCHMARK_RUNNER: ${BENCHMARK_RUNNER:-fake}
      BENCHMARK_CONCURRENCY: ${BENCHMARK_CONCURRENCY:-2}
      BENCHMARK_DEFAULT_RUN_COST_USD: ${BENCHMARK_DEFAULT_RUN_COST_USD:-0.5}
      BENCHMARK_CONFIRM_THRESHOLD_USD: ${BENCHMARK_CONFIRM_THRESHOLD_USD:-5}
      BENCHMARK_MAX_COST_USD: ${BENCHMARK_MAX_COST_USD:-25}
      BENCHMARK_PASS_THRESHOLD: ${BENCHMARK_PASS_THRESHOLD:-0.8}
      # Self-improvement (Phase 5): compose lowers the eligibility floor so the smoke corpus
      # (one scored run + benchmark trials) can produce a proposal deterministically.
      IMPROVEMENT_MIN_SCORED_RUNS: ${IMPROVEMENT_MIN_SCORED_RUNS:-1}
      IMPROVEMENT_WINDOW_DAYS: ${IMPROVEMENT_WINDOW_DAYS:-30}
      IMPROVEMENT_MAX_PROPOSALS: ${IMPROVEMENT_MAX_PROPOSALS:-5}
      DEFINITION_REPO_OWNER: ${DEFINITION_REPO_OWNER:-factory}
      # Phase 3b: webhook HMAC (by secret reference), payload cap and the merge queue.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-smoke-webhook-secret}
      WEBHOOK_PUBLIC_URL: ${WEBHOOK_PUBLIC_URL:-http://localhost:8080}
      WEBHOOK_MAX_BYTES: ${WEBHOOK_MAX_BYTES:-1000000}
      MERGE_BATCH_SIZE: ${MERGE_BATCH_SIZE:-2}
      MERGE_CHECKS_TIMEOUT_MS: ${MERGE_CHECKS_TIMEOUT_MS:-600000}
      MERGE_CHECKS_POLL_MS: ${MERGE_CHECKS_POLL_MS:-2000}
      MERGE_MAX_BATCHES: ${MERGE_MAX_BATCHES:-25}
      MERGE_IDLE_INTERVAL_MS: ${MERGE_IDLE_INTERVAL_MS:-30000}
      MERGE_IDLE_CYCLES: ${MERGE_IDLE_CYCLES:-2}
      GITHUB_DRY_RUN: ${GITHUB_DRY_RUN:-0}
    ports:
      - '8080:8080'
    volumes:
      - ./:/repo:ro
      - ./runs:/app/runs
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # The console reads the API server-side only (ADR-012). The public URL is kept for
      # parity/debugging; the browser talks to same-origin /api/* route handlers.
      API_BASE_URL: http://api:8080
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      NODE_ENV: production
      PORT: '3000'
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: packages/orchestration/Dockerfile
    environment:
      DATABASE_URL: postgres://factory:factory@postgres:5432/factory
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-factory-runs}
      FACTORY_ROOT: /repo/factories
      REPO_ROOT: /repo
      RUNS_DIR: /app/runs
      PROXY_PUBLIC_URL: ${PROXY_PUBLIC_URL:-http://host.docker.internal:8080/v1}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://127.0.0.1:8080/internal/stub-model/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-provider-secret}
      RUNNER_BACKEND: ${RUNNER_BACKEND:-docker}
      WORKER_HEARTBEAT_FILE: /app/runs/.worker-heartbeat
      PERMISSION_TIMEOUT_MS: ${PERMISSION_TIMEOUT_MS:-1800000}
      # Scoring (Phase 4a): deterministic checks are free; judges are sampled and capped.
      SCORING_JUDGE_MODE: ${SCORING_JUDGE_MODE:-stub}
      SCORING_MAX_SCORES_PER_DAY: ${SCORING_MAX_SCORES_PER_DAY:-200}
      SCORING_CADENCE_MS: ${SCORING_CADENCE_MS:-0}
      SCORING_CRON: ${SCORING_CRON:-0 3 * * *}
      SCORING_WINDOW_DAYS: ${SCORING_WINDOW_DAYS:-1}
      # Benchmarks (Phase 4b): hermetic trials on the fake harness + fake forge in compose.
      BENCHMARK_CONCURRENCY: ${BENCHMARK_CONCURRENCY:-2}
      BENCHMARK_DEFAULT_RUN_COST_USD: ${BENCHMARK_DEFAULT_RUN_COST_USD:-0.5}
      BENCHMARK_CONFIRM_THRESHOLD_USD: ${BENCHMARK_CONFIRM_THRESHOLD_USD:-5}
      BENCHMARK_MAX_COST_USD: ${BENCHMARK_MAX_COST_USD:-25}
      BENCHMARK_PASS_THRESHOLD: ${BENCHMARK_PASS_THRESHOLD:-0.8}
      # Self-improvement (Phase 5): eligibility floor + corpus window.
      IMPROVEMENT_MIN_SCORED_RUNS: ${IMPROVEMENT_MIN_SCORED_RUNS:-1}
      IMPROVEMENT_WINDOW_DAYS: ${IMPROVEMENT_WINDOW_DAYS:-30}
      IMPROVEMENT_MAX_PROPOSALS: ${IMPROVEMENT_MAX_PROPOSALS:-5}
      DEFINITION_REPO_OWNER: ${DEFINITION_REPO_OWNER:-factory}
      # Phase 3b: merge queue (ADR-022). The queue workflow runs in this worker.
      MERGE_BATCH_SIZE: ${MERGE_BATCH_SIZE:-2}
      MERGE_CHECKS_TIMEOUT_MS: ${MERGE_CHECKS_TIMEOUT_MS:-600000}
      MERGE_CHECKS_POLL_MS: ${MERGE_CHECKS_POLL_MS:-2000}
      MERGE_MAX_BATCHES: ${MERGE_MAX_BATCHES:-25}
      MERGE_IDLE_INTERVAL_MS: ${MERGE_IDLE_INTERVAL_MS:-30000}
      MERGE_IDLE_CYCLES: ${MERGE_IDLE_CYCLES:-2}
      # ADR-013: permission waits hold no activity slot, so 8 slots (the old hardcoded
      # value that used to starve the queue) is enough for eight blocked runs plus new work.
      # Raise for more concurrent streaming runs; the code default is Temporal's 100.
      WORKER_MAX_CONCURRENT_ACTIVITY_TASKS: ${WORKER_MAX_CONCURRENT_ACTIVITY_TASKS:-8}
      WORKER_MAX_CONCURRENT_WORKFLOW_TASKS: ${WORKER_MAX_CONCURRENT_WORKFLOW_TASKS:-8}
    volumes:
      - ./:/repo:ro
      - ./runs:/app/runs
      # Real (non-fake) runs lease sibling containers through the docker backend.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const s = require('node:fs').statSync('/app/runs/.worker-heartbeat'); process.exit(Date.now() - s.mtimeMs > 60000 ? 1 : 0)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
