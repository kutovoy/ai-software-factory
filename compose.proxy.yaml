# Optional websocket-capable proxy mode for the local forge
# (spec `forge-transport` › Optional websocket proxy).
#
#   docker compose -f compose.yaml -f compose.proxy.yaml up -d
#
# The default single-origin setup is unchanged: the console owns :3000 and serves the forge
# under http://localhost:3000/extras/forgejo/ through its own same-origin proxy. This overlay
# adds a second origin, http://localhost:3001, served by Caddy:
#
#   - Caddy calls `GET /api/v1/auth/forge-identity` on the API (`forward_auth`), which answers
#     200 + `X-WebAuth-User: <username>` for a signed-in session (401 otherwise) and copies
#     that header onto the proxied request, so the forge still auto-logs-in the console user.
#   - Everything else is reverse-proxied to forgejo:3000, including websocket upgrades, which
#     a Next route handler cannot perform.
#   - Forgejo is pointed at the new origin (ROOT_URL http://localhost:3001/, empty
#     STATIC_URL_PREFIX), so the links it generates stay on :3001.
#
# Use this mode when you need websockets (e.g. Forgejo's live UI updates). In it, open the
# forge at http://localhost:3001/ — the forge no longer believes it lives under /extras/forgejo,
# so the console's subpath proxy is not the primary path there (docs/HANDOVER.md).
services:
  forgejo:
    environment:
      FORGEJO__server__ROOT_URL: http://localhost:3001/
      FORGEJO__server__STATIC_URL_PREFIX: ''

  caddy:
    image: caddy:2-alpine
    ports:
      - '3001:3001'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      forgejo:
        condition: service_healthy
